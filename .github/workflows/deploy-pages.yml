name: Publish Spatial Harness demo

on:
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download and verify the published site package
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output site.zip \
            'https://github.com/spatial-harness-demo/spatial-harness-demo.github.io/releases/download/v1.0.0/site.zip'
          printf '%s  %s\n' 'e5212c63150b7a6ce70757a09362f0bd22af8db45e4070497b24aca0b74a2741' 'site.zip' | sha256sum --check --strict
          mkdir _site
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
